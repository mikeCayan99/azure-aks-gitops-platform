name: Azure Terraform manual

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, apply reviewed plan, or destroy reviewed plan
        type: choice
        options: [plan, apply, destroy]
        default: plan
      cleanup_deadline:
        description: Cleanup deadline in UTC ISO-8601 (informational; no automatic deletion)
        type: string
        required: true
      confirmation:
        description: For apply/destroy, type the configured TF_NAME_PREFIX
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: azure-terraform-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_USE_CLI: "false"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_STATE_ACCOUNT: ${{ vars.TF_STATE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
  TF_VAR_operator_object_id: ${{ vars.TF_OPERATOR_OBJECT_ID }}
  TF_VAR_registry_name: ${{ vars.TF_REGISTRY_NAME }}
  TF_VAR_kubernetes_version: ${{ vars.TF_KUBERNETES_VERSION }}
  TF_VAR_api_authorized_ip_ranges: ${{ vars.TF_API_AUTHORIZED_IP_RANGES }}
  TF_VAR_name_prefix: ${{ vars.TF_NAME_PREFIX }}
  TF_VAR_location: ${{ vars.TF_LOCATION }}
  TF_VAR_node_vm_size: ${{ vars.TF_NODE_VM_SIZE }}
  TF_VAR_cleanup_deadline: ${{ inputs.cleanup_deadline }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && vars.TERRAFORM_DISPATCH_ENABLED == 'true'
    name: Review Terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: azure-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check explicit operation confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          case "$OPERATION" in
            plan) ;;
            apply|destroy)
              test -n "$TF_VAR_name_prefix"
              test "$CONFIRMATION" = "$TF_VAR_name_prefix"
              ;;
            *) exit 1 ;;
          esac
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - name: Initialize remote state via OIDC
        run: bash .github/scripts/terraform-init.sh
      - name: Create and display plan
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          terraform -chdir=infrastructure/azure validate -no-color
          if [ "$OPERATION" = destroy ]; then
            terraform -chdir=infrastructure/azure plan -destroy -input=false -lock-timeout=5m -no-color -out=integration.tfplan
          else
            terraform -chdir=infrastructure/azure plan -input=false -lock-timeout=5m -no-color -out=integration.tfplan
          fi
      - name: Encrypt saved plan
        if: inputs.operation != 'plan'
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: bash .github/scripts/terraform-plan-transfer.sh seal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.operation != 'plan'
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan.gpg
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply approved saved plan
    needs: plan
    if: inputs.operation != 'plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: azure-change
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - name: Initialize same remote state
        run: bash .github/scripts/terraform-init.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Decrypt and verify saved plan
        env:
          PLAN_KEY: ${{ secrets.TF_PLAN_ENCRYPTION_KEY }}
        run: bash .github/scripts/terraform-plan-transfer.sh open
      - name: Apply exact approved plan
        run: terraform -chdir=infrastructure/azure apply -input=false -lock-timeout=5m -no-color integration.tfplan
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: inputs.operation == 'destroy'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify project deletion
        if: inputs.operation == 'destroy'
        run: |
          remaining_resources="$(terraform -chdir=infrastructure/azure state list)"
          test -z "$remaining_resources"
          test "$(az group exists --name "rg-$TF_VAR_name_prefix" --subscription "$ARM_SUBSCRIPTION_ID")" = false
          test "$(az group exists --name "rg-$TF_VAR_name_prefix-nodes" --subscription "$ARM_SUBSCRIPTION_ID")" = false
          echo 'Terraform state empty; both project resource groups absent.'
      - name: Record deployment outputs
        if: inputs.operation == 'apply'
        run: terraform -chdir=infrastructure/azure output -no-color
