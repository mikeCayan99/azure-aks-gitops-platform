apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo CD v3.5.3, pinned to its upstream commit.
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/c9c369efcc5b2a0bd720803f8d14a1c3eaddf579/manifests/install.yaml

# This project uses an Application, not ApplicationSets. Omit the unused
# controller and its namespaced and cluster-wide permissions before applying.
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: argocd-applicationset-controller
